name: CI aggregate

on:
  pull_request:

permissions:
  checks: read
  contents: read


# Superseded PR work may stop; every non-PR run keeps its own evidence.
concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-success:
    name: ci-success
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      REQUIRED_CHECKS: |-
        pre-commit (shellcheck + shfmt + hygiene)
        bats (script behaviour tests)
        secret scan (gitleaks)
      # Empty by design. Add an exact check name here only when a skipped
      # result is an explicitly valid outcome for that protected dependency.
      ALLOWED_SKIPPED_CHECKS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check snapshot failure and identity regressions
        run: python3 -m unittest discover -s tests -p test_ci_checks.py
      - name: Require protected checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(mktemp)
          trap 'rm -f "$snapshot"' EXIT
          deadline=$((SECONDS + 1500))
          while :; do
            # One paginated snapshot per poll, rather than one API call per name.
            # An API failure is a failure, never an empty/successful snapshot.
            gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs" \
              -f filter=all -F per_page=100 > "$snapshot"
            result=0
            python3 scripts/check_ci_checks.py < "$snapshot" || result=$?
            case "$result" in
              0) exit 0 ;;
              2) ;;
              *) echo '::error::Protected dependency failed or snapshot invalid'; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo '::error::Timed out waiting for protected dependencies'
              exit 1
            fi
            sleep 10
          done
